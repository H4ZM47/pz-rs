[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
pz-kahlua = { path = "crates/pz-kahlua" }
pz-fs = { path = "crates/pz-fs" }
pz-scripts = { path = "crates/pz-scripts" }
pz-entity = { path = "crates/pz-entity" }
pz-classfile = { path = "crates/pz-classfile" }
pz-input = { path = "crates/pz-input" }
pz-render = { path = "crates/pz-render" }
pz-text = { path = "crates/pz-text" }
pz-ui = { path = "crates/pz-ui" }
pz-lua-api = { path = "crates/pz-lua-api" }
pz-engine = { path = "crates/pz-engine" }
pz-world = { path = "crates/pz-world" }
pz-core = { path = "crates/pz-core" }
pz-characters = { path = "crates/pz-characters" }
pz-inventory = { path = "crates/pz-inventory" }
pz-anim = { path = "crates/pz-anim" }
pz-clipper6 = { path = "crates/pz-clipper6" }
pz-pathfind = { path = "crates/pz-pathfind" }
pz-audio = { path = "crates/pz-audio" }
pz-popman = { path = "crates/pz-popman" }
pz-lighting = { path = "crates/pz-lighting" }
indexmap = "2"
jiff = "0.2"
macroquad = { version = "0.4", default-features = false }
png = "0.17"
regex = "1"
miniz_oxide = "0.8"

[profile.dev.package."*"]
opt-level = 2
