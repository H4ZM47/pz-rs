[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
pz-kahlua = { path = "crates/pz-kahlua" }
pz-fs = { path = "crates/pz-fs" }
pz-render = { path = "crates/pz-render" }
pz-text = { path = "crates/pz-text" }
pz-ui = { path = "crates/pz-ui" }
pz-lua-api = { path = "crates/pz-lua-api" }
pz-engine = { path = "crates/pz-engine" }
indexmap = "2"
macroquad = { version = "0.4", default-features = false }
png = "0.17"
regex = "1"

[profile.dev.package."*"]
opt-level = 2
