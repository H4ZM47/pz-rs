[package]
name = "pz-characters"
version.workspace = true
edition.workspace = true

[dependencies]
pz-core.workspace = true
pz-scripts.workspace = true
pz-inventory.workspace = true
pz-fs.workspace = true
quick-xml.workspace = true
pz-anim.workspace = true
pz-world.workspace = true
pz-pathfind.workspace = true
pz-audio.workspace = true
pz-world-popman.workspace = true
pz-bullet = { workspace = true, optional = true }
pz-ragdoll = { workspace = true, optional = true }

[features]
# `PhysicsWorld` over pz-bullet's `PzBullet` and the `RagdollCharacter` of
# a character for pz-ragdoll.
bullet = ["dep:pz-bullet", "dep:pz-ragdoll"]

[dev-dependencies]
pz-popman.workspace = true
pz-sandbox.workspace = true
pz-bullet.workspace = true
pz-ragdoll.workspace = true
